[project]
name = "manim-toolchain"
version = "0.1.0"
description = "Reusable mathematical visualization and simulation toolchain."
requires-python = ">=3.13,<3.14"
dependencies = [
    "manim[typst]==0.21.0",
    "manim-voiceover[gemini]==0.4.0",
    "pygfx==0.17.0",
    "rendercanvas==2.7.2",
    "taichi==1.7.4",
    "wgpu==0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
